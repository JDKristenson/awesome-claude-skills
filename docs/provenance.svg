ace" font-size="16" fill="#1e1e1e">External skills, artwork and trademarks are not covered by an assumed catalog license.</text><text x="24" y="614" font-family="monospace" font-size="16" fill="#1e1e1e">Solid arrows: source to snapshot to documentation. Dashed: optional, NOT RUN.</text></svg>
